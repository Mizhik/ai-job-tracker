services:
  db:
    image: postgres:18
    container_name: ai-job-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DBNAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DBNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DBNAME: ${POSTGRES_DBNAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_ADDRESS: db:5432
    command:
      - sh
      - -c
      - yoyo apply --database "postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@db:5432/$${POSTGRES_DBNAME}" migrations
    profiles:
      - migrate

  app:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DBNAME: ${POSTGRES_DBNAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_ADDRESS: db:5432
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8000
      SERVER_RELOAD: false
    ports:
      - "${APP_PORT:-8000}:8000"
    profiles:
      - app

volumes:
  postgres_data:
