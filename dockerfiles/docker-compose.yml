services:
  db:
    image: postgres:18
    container_name: ai-job-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DBNAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DBNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DBNAME: ${POSTGRES_DBNAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_ADDRESS: db:5432
    command:
      - sh
      - -c
      - yoyo apply --batch --migration-table yoyo_migration --database "postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@db:5432/$${POSTGRES_DBNAME}" migrations
  app:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_DBNAME: ${POSTGRES_DBNAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_ADDRESS: db:5432
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8000
      SERVER_RELOAD: false
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_ALGORITHM: ${AUTH_ALGORITHM}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-8000}:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - app
    environment:
      VITE_BACKEND_TARGET: http://app:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  telegram-bot:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile
    depends_on:
      app:
        condition: service_started
    environment:
      POSTGRES_DBNAME: ${POSTGRES_DBNAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_ADDRESS: db:5432
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_USER_ID: ${TELEGRAM_ADMIN_USER_ID}
      API_BASE_URL: http://app:8000
    command:
      - python
      - -m
      - telegram_admin.main
    restart: unless-stopped

volumes:
  postgres_data:
